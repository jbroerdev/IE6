<!doctype html><html lang="de"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><title>Classic Browser</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="assets/activity.css"></head><body>
<div id="toolbar" class="band"><span class="grip" aria-hidden="true"></span>
<div class="split"><button id="back" data-cmd="back" title="Zurück (Alt+Links)"><i class="sprite" style="--index:0"></i><span>Zurück</span></button><button class="arrow" data-history="back" title="Vorherige Seiten"></button></div>
<div class="split"><button id="forward" data-cmd="forward" title="Vorwärts (Alt+Rechts)"><i class="sprite" style="--index:1"></i><span>Vorwärts</span></button><button class="arrow" data-history="forward" title="Nächste Seiten"></button></div>
<button data-cmd="stop" title="Abbrechen (Esc)"><i class="sprite" style="--index:3"></i><span>Abbrechen</span></button><button data-cmd="reload" title="Aktualisieren (F5)"><i class="sprite" style="--index:2"></i><span>Aktualisieren</span></button><button data-cmd="home" title="Startseite (Alt+Pos1)"><i class="sprite" style="--index:4"></i><span>Startseite</span></button><span class="separator"></span>
<button data-cmd="panel-search" title="Im Web suchen"><i class="sprite" style="--index:5"></i><span>Suchen</span></button><button data-cmd="panel-favorites" title="Favoriten (Strg+I)"><i class="sprite" style="--index:6"></i><span>Favoriten</span></button><button data-cmd="panel-history" title="Verlauf (Strg+H)"><i class="sprite" style="--index:7"></i><span>Verlauf</span></button><span class="separator"></span><button data-cmd="print" title="Drucken (Strg+P)"><i class="sprite" style="--index:8"></i><span>Drucken</span></button><span class="toolbar-space"></span><span id="throbber" title="Classic Browser" aria-label="Ladeaktivität"></span></div>
<div id="address-band" class="band"><span class="grip" aria-hidden="true"></span><form id="address-form"><label for="address">A<u>d</u>resse</label><div class="address-field"><img src="assets/page.png" alt=""><input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Internetadresse"><button type="button" class="drop-button" data-history="address" title="Adressverlauf"></button></div><button type="submit" class="go"><img src="assets/go.png" alt=""><span>Wechseln zu</span></button></form><div id="links"><span class="grip" aria-hidden="true"></span><button id="links-menu" title="Links anzeigen">Links <span class="chevron">»</span></button><div class="link-items"><button data-url="https://www.microsoft.com"><img src="assets/page.png" alt="">Microsoft</button><button data-url="https://archive.org"><img src="assets/page.png" alt="">Internet Archive</button></div></div></div>
<div id="workspace"><aside id="sidebar" hidden><div class="sidebar-heading"><b id="sidebar-title">Favoriten</b><button data-cmd="panel-close" title="Schließen">×</button></div><div id="sidebar-tools"></div><div id="sidebar-content"></div></aside><div id="page-area"><div id="viewport" tabindex="-1"></div><div id="error-page" hidden><h1>Die Seite kann nicht angezeigt werden.</h1><p>Überprüfen Sie die Internetadresse und Ihre Netzwerkverbindung.</p><p id="error-detail"></p><button data-cmd="reload">Erneut versuchen</button></div></div></div>
<form id="findbar" hidden><label for="find-input">Suchen:</label><input id="find-input" autocomplete="off"><button id="find-prev" type="button">Zurück</button><button type="submit">Weitersuchen</button><span id="find-result"></span><button type="button" data-cmd="find-close" title="Suchleiste schließen">×</button></form>
<footer><div class="status-message"><img src="assets/page.png" alt=""><span id="status" role="status">Fertig</span></div><div id="progress"></div><div class="status-cell"></div><div class="zone"><img src="assets/internet.png" alt=""><span>Internet</span></div><div class="sizegrip" aria-hidden="true"></div></footer><script src="renderer.js"></script></body></html>
